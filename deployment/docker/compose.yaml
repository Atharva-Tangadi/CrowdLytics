services:
  db:
    image: postgres:16-alpine
    container_name: crowdlytics_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crowdlytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crowdlytics_secret}
      POSTGRES_DB: ${POSTGRES_DB:-crowdlytics}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crowdlytics}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crowdlytics_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: crowdlytics_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-crowdlytics}:${POSTGRES_PASSWORD:-crowdlytics_secret}@db:5432/${POSTGRES_DB:-crowdlytics}
      - SECRET_KEY=${SECRET_KEY:-production-secret-change-me}
      - STORAGE_TYPE=local
      - MEDIA_ROOT=/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_storage:/app/storage

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: crowdlytics_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_storage:
